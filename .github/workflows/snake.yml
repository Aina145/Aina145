name: Generate Animation

on:
  # Din mein aik baar khud-b-khud update ho
  schedule:
    - cron: "0 0 * * *"
  
  # Manual trigger karne ka option bhi ho
  workflow_dispatch:
  
  # Jab bhi main branch par koi commit ho tab bhi chale
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Repository ko checkout karna
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Snake animation generate karna
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Generated files ko aik alag branch (output) par push karna
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
